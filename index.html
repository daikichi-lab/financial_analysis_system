<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>決算書 財務分析（簡易版・最大3期）</title>
<style>
  :root{
    --bg:#f4f5f7;--panel:#ffffff;--line:#333;--ink:#1a1a1a;--muted:#666;
    --accent:#2b6cb0;--good:#2f855a;--warn:#b7791f;--bad:#c53030;--grid:#e2e8f0;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
  header{background:#1f2937;color:#fff;padding:14px 20px;}
  header h1{margin:0;font-size:18px;font-weight:600;}
  header p{margin:4px 0 0;font-size:12px;color:#cbd5e0;}
  .wrap{max-width:1200px;margin:0 auto;padding:18px;}

  .tabs{display:flex;gap:4px;border-bottom:2px solid #cbd5e0;margin-bottom:16px;}
  .tab{padding:10px 22px;border:none;background:transparent;font-size:14px;font-weight:600;color:#64748b;cursor:pointer;border-radius:8px 8px 0 0;flex:0 0 auto;border-bottom:3px solid transparent;margin-bottom:-2px;}
  .tab:hover{color:#334155;background:#eef2f6;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);background:#fff;}
  .tabpane{display:none;}
  .tabpane.active{display:block;}

  .panel{background:var(--panel);border:1px solid #d7dbe0;border-radius:8px;padding:14px;}
  .panel h2{margin:0 0 10px;font-size:14px;border-left:4px solid var(--accent);padding-left:8px;}
  .panel h3{margin:14px 0 6px;font-size:12px;color:var(--muted);border-bottom:1px dashed #ccc;padding-bottom:3px;}

  .field{display:flex;align-items:center;justify-content:space-between;margin:5px 0;gap:8px;}
  .field label{font-size:12px;flex:1;}
  .field select{width:130px;padding:4px 6px;font-size:13px;border:1px solid #bbb;border-radius:4px;background:#fff;}
  .field select:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .btnrow{display:flex;gap:8px;margin-top:12px;}
  button{flex:1;padding:8px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:#e2e8f0;color:#333;}
  .note{font-size:11px;color:var(--muted);margin-top:8px;}
  .unit{font-size:11px;color:var(--muted);min-width:44px;text-align:left;}

  /* company + period bar */
  .companytabs{display:flex;gap:6px;margin-bottom:10px;}
  .periodbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;padding:8px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;}
  .ptab{flex:0 0 auto;padding:6px 14px;border:1px solid #cbd5e0;background:#fff;color:#334155;font-size:12px;font-weight:700;border-radius:6px;cursor:pointer;}
  .ptab.active{background:var(--accent);color:#fff;border-color:transparent;}
  .addper{display:inline-flex;gap:4px;align-items:center;margin-left:auto;}
  .btn-add{flex:0 0 auto;padding:6px 12px;font-size:12px;font-weight:700;border-radius:6px;background:var(--good);color:#fff;border:none;cursor:pointer;}
  .btn-add:disabled{opacity:.4;cursor:not-allowed;}

  /* ledger input form */
  .bs-title{background:#8a8f96;color:#fff;text-align:center;font-weight:700;padding:6px;border-radius:4px 4px 0 0;position:relative;font-size:13px;}
  .bs-unit{position:absolute;right:10px;top:7px;font-size:10px;font-weight:400;}
  .ledger{border:1px solid #e2e8f0;border-radius:6px;overflow:hidden;}
  .frow{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid #eef1f4;}
  .frow:last-child{border-bottom:none;}
  .frow label{flex:1;font-size:12.5px;}
  .frow input{width:130px;text-align:right;padding:4px 6px;font-size:13px;border:1px solid #bbb;border-radius:4px;font-variant-numeric:tabular-nums;}
  .frow input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .frow input[readonly]{background:#f1f5f9;color:#334155;border-color:#e2e8f0;font-weight:700;}
  .frow .autoval{width:130px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:#334155;}
  .frow.fbig{background:#fafbfc;}
  .frow.fbig label{font-weight:700;}
  .frow.fauto{background:#eef1f4;}
  .frow.fauto label{font-weight:700;}
  .frow.fleaf label{padding-left:18px;font-size:12px;color:#475569;}
  .frow.fsub label{padding-left:18px;color:#64748b;font-size:12px;}
  .fsec{background:#5b6670;color:#fff;font-weight:700;font-size:12px;padding:5px 10px;}
  .fsec.liab{background:#2f6fb0;}
  .fsec.na{background:#2f9e6f;}
  .det-toggle{flex:0 0 auto;font-size:11px;padding:3px 8px;border:1px solid #cbd5e0;background:#fff;color:#475569;border-radius:5px;cursor:pointer;font-weight:600;}
  .det-toggle:hover{background:#eef2f6;}
  .det-toggle.on{background:var(--accent);color:#fff;border-color:transparent;}
  .bs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
  @media(max-width:700px){.bs-grid{grid-template-columns:1fr;}}
  .bs-balance{margin-top:8px;padding:8px 12px;border-radius:6px;font-size:13px;font-weight:700;text-align:center;}
  .bs-balance.ok{background:#e6f4ea;color:var(--good);border:1px solid #a7d7b8;}
  .bs-balance.ng{background:#fde8e8;color:var(--bad);border:1px solid #f0b4b4;}

  /* chart */
  .chart-card{overflow:hidden;}
  svg{font-family:inherit;}
  #chart{width:100%;}
  .fig60{height:60vh;width:100%;}
  .fig60 svg{display:block;width:100%;height:100%;margin:0 auto;}
  #mainExtra{margin-top:10px;}
  .mbtn.detmet{background:#eef2f6;color:#475569;border-style:dashed;}
  .mbtn.detmet.active{background:#64748b;color:#fff;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:10px;font-size:12px;color:#444;}
  .legend .lg{display:inline-flex;align-items:center;gap:5px;}
  .legend .lg i{width:14px;height:12px;border:1px solid #333;display:inline-block;}
  .legend .lg i.lgline{width:16px;height:0;border:none;border-top:2px solid #333;}
  .legend .lg i.lgline.red{border-top-color:#c53030;}

  /* analysis */
  .analysis{margin-top:16px;}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .subtab{flex:0 0 auto;padding:8px 18px;border:1px solid #cbd5e0;background:#eef2f6;color:#475569;font-size:13px;font-weight:700;border-radius:999px;cursor:pointer;transition:.15s;}
  .subtab:hover{background:#e2e8f0;}
  .subtab.active{color:#fff;border-color:transparent;}
  .subtab[data-cat="growth"].active{background:#5b8def;}
  .subtab[data-cat="eff"].active{background:#8b5cf6;}
  .subtab[data-cat="prof"].active{background:#e0873a;}
  .subtab[data-cat="cost"].active{background:#0d9488;}
  .subtab[data-cat="safe"].active{background:#2f9e6f;}
  .companytabs .subtab.active{background:var(--accent);}
  .metricbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .mbtn{flex:0 0 auto;padding:8px 14px;border:1.5px solid #cbd5e0;background:#fff;color:#334155;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:baseline;}
  .mbtn:hover{border-color:#94a3b8;background:#f8fafc;}
  .mbtn.active{border-color:var(--accent);background:#eef5fc;color:var(--accent);box-shadow:0 0 0 2px rgba(43,108,176,.15);}
  .mbtn .mbv{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
  .mbtn .mbv small{font-size:10px;font-weight:600;margin-left:1px;}
  .metricdetail{border:1px solid #e2e8f0;border-radius:8px;background:#fbfcfd;overflow:hidden;}
  .md-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;flex-wrap:wrap;}
  .md-title{font-size:15px;font-weight:700;}
  .md-value{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;}
  .md-value small{font-size:13px;font-weight:600;margin-left:2px;}
  .md-body{padding:14px 16px;display:grid;gap:14px;}
  .md-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;}
  .md-formula{font-size:14px;font-variant-numeric:tabular-nums;background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:9px 12px;line-height:1.8;}
  .md-formula b{color:var(--accent);}
  .md-meaning{font-size:12.5px;line-height:1.75;color:#374151;}
  .md-table{grid-column:1/-1;}
  .cmp-toggle{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .cbtn{flex:0 0 auto;padding:5px 14px;font-size:12px;font-weight:700;border:1px solid #cbd5e0;background:#fff;color:#475569;border-radius:999px;cursor:pointer;}
  .cbtn.active{background:var(--accent);color:#fff;border-color:transparent;}
  .cbtn:disabled{opacity:.4;cursor:not-allowed;}
  table.judge{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.judge th,table.judge td{border:1px solid #e2e8f0;padding:6px 10px;text-align:left;}
  table.judge th{background:#f1f5f9;font-size:11px;color:var(--muted);font-weight:700;}
  table.judge td.lv{width:64px;font-weight:700;text-align:center;color:#fff;}
  table.judge td.lv.good{background:var(--good);}
  table.judge td.lv.warn{background:var(--warn);}
  table.judge td.lv.bad{background:var(--bad);}
  table.judge td.num{text-align:right;font-variant-numeric:tabular-nums;}
  table.judge td.num small{font-size:10px;color:var(--muted);margin-left:1px;}
  table.judge tr.cur td{background:#fff8e6;}
  table.judge tr.cur td.lv.good{background:var(--good);}
  table.judge tr.cur td.lv.warn{background:var(--warn);}
  table.judge tr.cur td.lv.bad{background:var(--bad);}
  .cur-tag{display:inline-block;margin-left:6px;font-size:10px;color:var(--accent);font-weight:700;}
  .md-note{grid-column:1/-1;font-size:11px;color:var(--muted);}
  .badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;color:#fff;margin-left:6px;vertical-align:middle;}
  .b-good{background:var(--good);}.b-warn{background:var(--warn);}.b-bad{background:var(--bad);}.b-na{background:#94a3b8;}

  /* detail comparison table */
  .detail-wrap{overflow-x:auto;}
  table.cmp-detail{border-collapse:collapse;width:100%;font-size:12.5px;min-width:540px;}
  table.cmp-detail th,table.cmp-detail td{border:1px solid #e2e8f0;padding:6px 10px;}
  table.cmp-detail thead th{background:#1f2937;color:#fff;font-weight:700;text-align:right;font-size:11px;white-space:nowrap;}
  table.cmp-detail thead th.itemcol{text-align:left;}
  table.cmp-detail td.itemcol{text-align:left;white-space:nowrap;}
  table.cmp-detail td.num{text-align:right;font-variant-numeric:tabular-nums;}
  table.cmp-detail td.delta{color:var(--muted);}
  table.cmp-detail tr.grp td{background:#eef2f6;font-weight:700;color:#334155;}
  table.cmp-detail tr.grp .u{font-weight:400;font-size:11px;color:var(--muted);margin-left:8px;}
  table.cmp-detail tr.totrow td{background:#f6f8fa;font-weight:700;}
  table.cmp-detail tr.grand td{background:#dfe4ea;font-weight:700;}
  table.cmp-detail td.leaf{color:#475569;padding-left:22px;}
  table.cmp-detail tr.ibd td{background:#fdf1e7;color:#b45309;font-weight:700;}

  /* detail figures */
  .view-controls{margin-bottom:10px;}
  .ctl-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;}
  .ctl-lbl{font-size:12px;color:#555;font-weight:700;}
  .chip{flex:0 0 auto;padding:5px 12px;font-size:12px;font-weight:700;border:1px solid #cbd5e0;background:#fff;color:#475569;border-radius:999px;cursor:pointer;}
  .chip:hover{background:#f1f5f9;}
  .chip.on{background:var(--accent);color:#fff;border-color:transparent;}
  .view-controls select{padding:5px 8px;font-size:12px;border:1px solid #bbb;border-radius:6px;background:#fff;}
  .itemchecks{display:flex;gap:20px;flex-wrap:wrap;border:1px solid #e2e8f0;border-radius:6px;padding:10px;margin-top:6px;max-height:220px;overflow:auto;}
  .itemchecks[hidden]{display:none;}
  .ic-col{min-width:150px;}
  .ic-h{font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:4px;}
  .ic-i{display:flex;gap:6px;align-items:center;font-size:12px;padding:2px 0;cursor:pointer;}
  .ph{color:#94a3b8;font-size:13px;padding:24px;text-align:center;}
  #dChart{overflow-x:auto;width:100%;}
  #dChart svg{display:block;width:100%;height:auto;margin:0 auto;}
  .fig50{height:50vh;width:100%;}
  .fig50 svg{height:100%;}
  .cf-pattern{border:1px solid #e2e8f0;border-radius:8px;padding:14px 16px;background:#fff;margin-bottom:12px;}
  .cf-badge{display:inline-block;background:var(--accent);color:#fff;font-weight:800;font-size:14px;padding:4px 14px;border-radius:999px;}
  .cf-desc{font-size:12.5px;color:#374151;margin-top:8px;line-height:1.7;}
  .cf-signs{margin-top:8px;font-size:12.5px;color:#334155;}
  .cf-signs b{font-variant-numeric:tabular-nums;}
  .cf-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px;}
  .cf-tile{border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;background:#fbfcfd;}
  .cf-tile .t{font-size:11px;color:var(--muted);}
  .cf-tile .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}
  .cf-h{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;}
  .cf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
  .cf-card{border:1px solid #e2e8f0;border-radius:8px;padding:10px;background:#fff;display:flex;gap:10px;align-items:flex-start;}
  .cf-card.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(43,108,176,.15);background:#eef5fc;}
  .cf-card .cf-ct .nm{font-weight:700;font-size:12.5px;}
  .cf-card .cf-ct .ds{color:#475569;font-size:11px;margin-top:3px;line-height:1.5;}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-overlay[hidden]{display:none;}
  .modal{background:#fff;border-radius:10px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden;}
  .modal-title{font-size:15px;font-weight:700;padding:14px 18px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;}
  .modal-body{padding:18px;font-size:13px;}
  .modal-body .modal-label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700;}
  .modal-body input[type=number]{width:100%;padding:8px;font-size:15px;border:1px solid #bbb;border-radius:6px;text-align:right;font-variant-numeric:tabular-nums;}
  .modal-body input[type=number]:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .modal-msg{line-height:1.7;}
  .modal-err{color:var(--bad);font-size:12px;margin-top:8px;min-height:16px;}
  .modal-actions{display:flex;gap:8px;padding:0 18px 18px;}
  .modal-actions button{padding:9px;border-radius:6px;font-size:13px;font-weight:700;}
  .btn-danger{background:var(--bad);color:#fff;}

  footer{text-align:center;font-size:11px;color:var(--muted);padding:16px;}
</style>
</head>
<body>
<header>
  <h1>決算書 財務分析ツール（簡易版）</h1>
  <p>最大3期を入力（中分類の内訳入力）→ 全体／PL／BS／CS と指標分析を1画面で比較</p>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-tab="view">① 財務分析</button>
    <button class="tab" data-tab="input">② 数値入力</button>
  </div>

  <!-- ============ TAB: VIEW ============ -->
  <div class="tabpane active" id="tab-view">
    <section class="panel chart-card">
      <h2>財務分析（最大3期）</h2>
      <div class="cmp-toggle" id="scopeToggle">
        <button class="cbtn active" data-scope="all">全体（BS＋PL）</button>
        <button class="cbtn" data-scope="pl">PLのみ</button>
        <button class="cbtn" data-scope="bs">BSのみ</button>
        <button class="cbtn" data-scope="cs">CS（簡易）</button>
      </div>
      <div id="mainControls" class="view-controls"></div>
      <div id="chart"></div>
      <div class="legend" id="legend"></div>
      <div id="mainExtra"></div>
    </section>
    <div class="analysis">
      <div class="subtabs" id="subtabs">
        <button class="subtab" data-cat="growth">成長性</button>
        <button class="subtab" data-cat="eff">効率性</button>
        <button class="subtab active" data-cat="prof">収益性</button>
        <button class="subtab" data-cat="safe">安全性</button>
      </div>
      <div class="metricbtns" id="metricbtns"></div>
      <div class="metricdetail" id="metricdetail"></div>
    </div>
  </div>

  <!-- ============ TAB: INPUT ============ -->
  <div class="tabpane" id="tab-input">
    <section class="panel">
      <h2>決算書の入力</h2>
      <div class="companytabs"><button class="subtab active">自社</button></div>
      <div class="periodbar" id="periodbar"></div>
      <div class="field"><label>金額の単位</label>
        <select id="unit">
          <option value="10億円">10億円</option>
          <option value="億円" selected>億円</option>
          <option value="100万円">100万円</option>
          <option value="万円">万円</option>
          <option value="円">円</option>
        </select>
      </div>

      <h3>貸借対照表（BS）</h3>
      <div class="bs-title">貸借対照表<span class="bs-unit">単位：億円</span></div>
      <div class="bs-grid">
        <div id="bsLeft" class="ledger"></div>
        <div id="bsRight" class="ledger"></div>
      </div>
      <div class="bs-balance" id="bsBalance"></div>

      <h3>損益計算書（PL）</h3>
      <div class="field"><label>売上原価の型（業種）</label>
        <select id="costType">
          <option value="A" selected>製造業（材料費・労務費・外注費…）</option>
          <option value="B">商業・小売（仕入・棚卸）</option>
          <option value="C">サービス業（労務費・外注費…）</option>
        </select>
      </div>
      <div id="plForm" class="ledger"></div>

      <div class="btnrow">
        <button class="btn-primary" id="calcBtn">分析する</button>
        <button class="btn-ghost" id="resetBtn">この期をリセット（0）</button>
        <button class="btn-ghost" id="delBtn">この期を削除</button>
      </div>
      <p class="note">各大項目の内訳（中分類）を常時入力できます。合計は入力可で、「その他」は 合計−主要内訳 の差額を自動表示します。有利子負債（★）・減価償却費は内訳から自動集計。「＋ 期を追加」で最大3期まで比較できます。</p>
    </section>
  </div>

  <footer>簡易版：収益性・効率性・安全性（有利子負債・ICR・債務償還年数ほか）・成長性を最大3期で比較</footer>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-overlay" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="modalCancel">キャンセル</button>
      <button class="btn-primary" id="modalOk">OK</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("ja-JP");
const p1 = n => (Math.round(n*10)/10).toFixed(1);
const p2 = n => (Math.round(n*100)/100).toFixed(2);
const unitStr = () => { const el=$("unit"); return el ? el.value : "億円"; };
const TLAB = v => '第'+v+'期';
function applyUnitLabels(){
  const u=unitStr();
  document.querySelectorAll(".unit").forEach(s=> s.textContent=u);
  const bu=document.querySelector(".bs-unit"); if(bu) bu.textContent="単位："+u;
}

const MAXP = 3;
const NUM_KEYS = ['ca','cash','sec','recv','inv','oca','stloanto','prepaid','fa','tfa','ifa','iota','building','vehicle','land','software','invsec',
  'cl','payb','stloan','cpltd','ocl','payables','taxpay','fl','ltloan','bond','ofl','execloan','lease','ibds','ibdl',
  'cap','csurp','re','ona','sales','cogs','sga','noi','recint','noe','intexp','exg','exl','tax','dep',
  'matcost','labcost','subcon','depcogs','othcogs','beginv','purch','endinv',

function computeVals(v){
  const g=k=> +v[k]||0;
  // 大項目（合計）が主。内訳を開いた場合、その他＝合計−主要内訳 の残差とする
  const ca=g('ca'), fa=g('fa'), cl=g('cl'), fl=g('fl');
  const cash=g('cash'), sec=g('sec'), recv=g('recv'), inv=g('inv'), stloanto=g('stloanto'), prepaid=g('prepaid');
  const oca = v.det_ca ? ca-(cash+recv+inv+stloanto+prepaid) : g('oca');
  const building=g('building'), vehicle=g('vehicle'), land=g('land'), software=g('software'), invsec=g('invsec');
  const iota = v.det_fa ? fa-(building+vehicle+land+software+invsec) : g('iota');
  const payb=g('payb'), stloan=g('stloan'), cpltd=g('cpltd'), payables=g('payables'), taxpay=g('taxpay');
  const ocl = v.det_cl ? cl-(payb+stloan+cpltd+payables+taxpay) : g('ocl');
  const ltloan=g('ltloan'), bond=g('bond'), execloan=g('execloan'), lease=g('lease');
  const ofl = v.det_fl ? fl-(ltloan+bond+execloan+lease) : g('ofl');
  const cap=g('cap'), csurp=g('csurp'), re=g('re'), ona=g('ona');
  const na=cap+csurp+re+ona, totalAssets=ca+fa, totalCapital=cl+fl+na;
  // 有利子負債：内訳を開けば ★項目の合計、閉じていれば直接入力（短期/長期）
  const ibdShort = v.det_cl ? (stloan+cpltd) : g('ibds');
  const ibdLong  = v.det_fl ? (ltloan+bond) : g('ibdl');
  const ibd = ibdShort + ibdLong;
  const quick=cash+sec+recv;
  const sales=g('sales'),noi=g('noi'),recint=g('recint'),noe=g('noe'),intexp=g('intexp'),exg=g('exg'),exl=g('exl'),tax=g('tax');
  let cogs, othcogs=g('othcogs');
  if(v.det_cogs){
    if(costType==='B'){ cogs=g('beginv')+g('purch')-g('endinv'); }
    else { cogs=g('cogs'); othcogs = cogs-(costType==='A' ? g('matcost')+g('labcost')+g('subcon')+g('depcogs') : g('labcost')+g('subcon')); }
  } else cogs=g('cogs');
  const sga = g('sga');
  const othsga = v.det_sga ? sga-(g('execcomp')+g('salary')+g('welfare')+g('adv')+g('rent')+g('depsga')+g('outsourcing')) : g('othsga');
  // 減価償却費：内訳を開けば内訳の値、閉じていれば直接入力（製造原価分・販管費分）
  const dep = g('depcogs') + g('depsga');
  const laborCost = (v.det_cogs&&costType!=='B'?g('labcost'):0) + (v.det_sga?(g('execcomp')+g('salary')+g('welfare')):0);
  const personnelReady = !!(v.det_sga || (v.det_cogs&&costType!=='B'));
  const grossProfit=sales-cogs, operatingProfit=grossProfit-sga, ordinaryProfit=operatingProfit+noi-noe, pretaxProfit=ordinaryProfit+exg-exl, netIncome=pretaxProfit-tax;
  const busProfit=operatingProfit+recint, simpleCF=operatingProfit+dep;
  const costRatio=sales? cogs/sales*100:0, sgaRatio=sales? sga/sales*100:0, personnelRatio=sales? laborCost/sales*100:0, laborShare=grossProfit>0? laborCost/grossProfit*100:0;
  const ibdReady=!!(v.det_cl||v.det_fl||(+v.ibds||0)!==0||(+v.ibdl||0)!==0), quickReady=!!v.det_ca;
  const currentRatio=cl? ca/cl*100:0;
  const quickRatio=cl? quick/cl*100:0;
  const fixedLTRatio=(na+fl)? fa/(na+fl)*100:0;
  const roe=na? netIncome/na*100:0;
  const equityRatio=totalCapital? na/totalCapital*100:0;
  const netMargin=sales? netIncome/sales*100:0;
  const opMargin=sales? operatingProfit/sales*100:0;
  const grossMargin=sales? grossProfit/sales*100:0;
  const assetTurnover=totalCapital? sales/totalCapital:0;
  const finLeverage=na? totalCapital/na:0;
  const ordMargin=sales? ordinaryProfit/sales*100:0;
  const roa=totalAssets? netIncome/totalAssets*100:0;
  const taxRate=pretaxProfit>0? tax/pretaxProfit:0;
  const nopat=operatingProfit*(1-taxRate);
  const investedCap=ibd+na;
  const roic=investedCap>0? nopat/investedCap*100:0;
  const atoturn=totalAssets? sales/totalAssets:0;
  const faturn=fa? sales/fa:0;
  const debtRatio=na? (cl+fl)/na*100:0;
  const fixedRatio=na? fa/na*100:0;
  const wc=ca-cl;
  const de=na? ibd/na:0;
  const ibdRatio=totalCapital? ibd/totalCapital*100:0;
  const netDe=na? (ibd-cash)/na:0;
  const debtMonths=sales? ibd/(sales/12):0;
  const icr=intexp>0? busProfit/intexp:0;
  const debtYears=(ibd<=0)?0:(simpleCF>0? ibd/simpleCF:Infinity);
  const invTurnover=inv>0? cogs/inv:0;
  const recvDays=sales>0? recv/(sales/365):0;
  return {ca,fa,cl,fl,cash,sec,recv,inv,oca,stloanto,prepaid,iota,building,vehicle,land,software,invsec,
    payb,stloan,cpltd,ocl,payables,taxpay,ltloan,bond,ofl,execloan,lease,
    cap,csurp,re,ona,na,totalAssets,totalCapital,ibd,ibdShort,ibdLong,quick,
    sales,cogs,sga,noi,recint,noe,intexp,exg,exl,tax,dep,
    grossProfit,operatingProfit,ordinaryProfit,pretaxProfit,netIncome,busProfit,simpleCF,
    currentRatio,quickRatio,fixedLTRatio,roe,equityRatio,netMargin,opMargin,grossMargin,assetTurnover,finLeverage,ordMargin,roa,roic,nopat,investedCap,
    de,ibdRatio,netDe,debtMonths,icr,debtYears,invTurnover,recvDays,ibdReady,quickReady,atoturn,faturn,debtRatio,fixedRatio,wc,
    matcost:g('matcost'),labcost:g('labcost'),subcon:g('subcon'),depcogs:g('depcogs'),othcogs,
    beginv:g('beginv'),purch:g('purch'),endinv:g('endinv'),execcomp:g('execcomp'),salary:g('salary'),welfare:g('welfare'),adv:g('adv'),rent:g('rent'),depsga:g('depsga'),outsourcing:g('outsourcing'),othsga,
    laborCost,costRatio,sgaRatio,personnelRatio,laborShare,personnelReady,
    detCa:!!v.det_ca,detFa:!!v.det_fa,detCl:!!v.det_cl,detFl:!!v.det_fl,detCogs:!!v.det_cogs,detSga:!!v.det_sga};
}
const derived = () => {
  const arr=periods.map(p=> ({year:p.year, d:computeVals(p.vals)}));
  const g=(cur,prev)=> (prev!=null && prev!==0) ? (cur-prev)/Math.abs(prev)*100 : null;
  arr.forEach((r,i)=>{ const pv=i>0?arr[i-1].d:null;
    r.d.gSales = pv? g(r.d.sales,pv.sales):null;
    r.d.gGross = pv? g(r.d.grossProfit,pv.grossProfit):null;
    r.d.gOp    = pv? g(r.d.operatingProfit,pv.operatingProfit):null;
    r.d.gNa    = pv? g(r.d.na,pv.na):null;
  });
  return arr;
};

function buildInputForm(){
  const v=periods[curIdx].vals, u=unitStr();
  const g=k=> (v[k]!=null? v[k]:0);
  const numRow=(key,label,cls='')=> `<div class="frow ${cls}"><label>${label}</label><input type="number" id="in_${key}" value="${g(key)}"><span class="unit">${u}</span></div>`;
  const autoRow=(key,label,cls='')=> `<div class="frow fauto ${cls}"><label>${label}</label><span class="autoval" id="in_${key}">0</span><span class="unit">${u}</span></div>`;
  function bigRow(item){
    const cogsIdentity = (item.big==='cogs' && costType==='B'); // 商業の原価は期首+仕入−期末の計算式
    let h=`<div class="frow fbig"><label>${item.label}</label>`;
    if(cogsIdentity) h+=`<input type="number" id="in_${item.big}" value="0" readonly>`;
    else h+=`<input type="number" id="in_${item.big}" value="${g(item.big)}">`; // 合計は入力可（「その他」は差額を自動計算）
    h+=`<span class="unit">${u}</span></div>`;
    const lv=item.leavesFn? item.leavesFn(): item.leaves, resid=cogsIdentity?null:otherOf(item.big); // 内訳は常時表示
    h+=lv.map(([k,lb])=> k===resid ? autoRow(k,lb,'fleaf') : numRow(k,lb,'fleaf')).join('');
    return h;
  }
  function render(struct){
    return struct.map(item=>{
      if(item.sec) return `<div class="fsec ${item.cls||''}">${item.sec}</div>`;
      if(item.big) return bigRow(item);
      if(item.auto) return autoRow(item.auto, item.label, item.sub?'fsub':'');
      if(item.plain) return numRow(item.plain, item.label, item.sub?'fsub':'');
      return '';
    }).join('');
  }
  $("bsLeft").innerHTML = render(BS_LEFT);
  $("bsRight").innerHTML = render(BS_RIGHT);
  $("plForm").innerHTML = render(PL_STRUCT);
  updateComputedInputs();
}
function updateComputedInputs(){

  if(v.det_sga) setTxt('othsga',d.othsga);

function comboSVG(ds, hi, showPL){
  showPL = showPL!==false;
  const n=ds.length;
  // 正の最大値と負の最小値（債務超過・損失に対応）
  let posMax=0, negMin=0;
  ds.forEach(({d})=>{
    posMax=Math.max(posMax, d.totalAssets, d.totalCapital, d.cl+d.fl+Math.max(d.na,0), d.cl+d.fl, showPL?d.sales:0, showPL?d.grossProfit:0);
    negMin=Math.min(negMin, d.na, showPL?d.grossProfit:0, showPL?d.operatingProfit:0, showPL?d.ordinaryProfit:0, showPL?d.netIncome:0);
  });
  if(posMax<=0) posMax=1;
  const AX=70, TOP=70, BOT=470, chH=BOT-TOP, span=posMax-negMin;
  const Y=v=> BOT-((v-negMin)/span)*chH;
  const BW=74, PLGAP=38, GPAD=44, groupInner=(showPL?3*BW+PLGAP:2*BW), slot=groupInner+GPAD*2, x0=AX+24, W=2*x0+n*slot, H=560;
  const y0=Y(0);
  const boxKeep=hi? new Set(hi.boxes||[]):null; if(boxKeep&&boxKeep.has('sales')) boxKeep.add('gp');
  const box=(x,w,yT,yB,fill,title)=> `<rect x="${x}" y="${yT}" width="${w}" height="${Math.max(0,yB-yT)}" fill="${fill}" stroke="#333" stroke-width="1">${title?`<title>${title}</title>`:''}</rect>`;
  const segLabel=(x,yT,yB,val)=> (yB-yT>=20)? `<text x="${x+BW/2}" y="${(yT+yB)/2+4}" font-size="13" fill="#fff" text-anchor="middle">${fmt(val)}</text>`:'';
  const segLabel2=(x,yT,yB,nm,val)=>{ const h=yB-yT; if(h<16) return ''; const cy=(yT+yB)/2;
    return h>=32 ? `<text x="${x+BW/2}" y="${cy-3}" font-size="11" fill="#fff" text-anchor="middle">${nm}</text><text x="${x+BW/2}" y="${cy+13}" font-size="13" fill="#fff" text-anchor="middle">${fmt(val)}</text>`
                 : `<text x="${x+BW/2}" y="${cy+4}" font-size="12" fill="#fff" text-anchor="middle">${fmt(val)}</text>`; };
  // 「うち〜」の内訳バンド（親ボックスの下部に点線枠で表示）
  const uchiBand=(x,yTop,yBot,total,sub,full,col)=>{
    if(!(sub>0)||!(total>0)) return '';
    const frac=Math.min(1,sub/total), bh=(yBot-yTop)*frac, by=yBot-bh;
    let g=`<rect x="${x+7}" y="${by}" width="${BW-14}" height="${Math.max(0,bh)}" fill="none" stroke="${col}" stroke-width="1.6" stroke-dasharray="4 2"><title>${full}：${fmt(sub)} ${unitStr()}</title></rect>`;
    if(bh>=12) g+=`<text x="${x+BW/2}" y="${by+bh/2+3}" font-size="9" fill="${col}" font-weight="bold" text-anchor="middle">${fmt(sub)}</text>`;
    return g;
  };
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="比較チャート" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:100%;margin:0 auto;">`;
  s+=`<line x1="${AX}" y1="${TOP}" x2="${AX}" y2="${BOT}" stroke="#333" stroke-width="1.5"/>`;
  s+=`<text x="${AX-30}" y="${TOP-12}" font-size="16" fill="#333">％</text>`;
  const pMin=Math.floor((negMin/posMax*100)/20)*20;
  for(let p=pMin;p<=100;p+=20){ const y=Y(p/100*posMax), emph=(p===0);
    s+=`<line x1="${AX}" y1="${y}" x2="${W-16}" y2="${y}" stroke="${emph?'#b8bcc2':'#eef1f4'}" stroke-width="${emph?1.2:1}"/><line x1="${AX-6}" y1="${y}" x2="${AX}" y2="${y}" stroke="#333"/><text x="${AX-10}" y="${y+5}" font-size="15" fill="#555" text-anchor="end">${p}</text>`; }
  s+=`<text x="6" y="${TOP-12}" font-size="14" fill="#777">単位：${unitStr()}</text>`;
  s+=`<text x="${AX+18}" y="26" font-size="14" fill="#555">最大値 ${fmt(posMax)} ${unitStr()} を 100% として表示（左＝古い ／ 右＝新しい）</text>`;
  ds.forEach(({year,d},gi)=>{
    const gx=x0+gi*slot+GPAD, bx=[gx,gx+BW,gx+2*BW+PLGAP];
    const tt=(nm,val,base)=>`${nm}：${fmt(val)} ${unitStr()}${base?`（${p1(val/base*100)}%）`:''}`;
    // 資産
    const yFa=Y(d.fa), yA=Y(d.fa+d.ca);
    s+=box(bx[0],BW,yFa,y0,C.fa,tt('固定資産',d.fa,d.totalAssets))+segLabel(bx[0],yFa,y0,d.fa);
    s+=box(bx[0],BW,yA,yFa,C.ca,tt('流動資産',d.ca,d.totalAssets))+segLabel(bx[0],yA,yFa,d.ca);
    // 負債・純資産（純資産マイナス＝債務超過にも対応）
    let naTop,naBot,flTop,flBot,yCl;
    if(d.na>=0){
      const yNa=Y(d.na), yFl=Y(d.na+d.fl), yRe=Y(d.re), capEq=d.na-d.re; yCl=Y(d.na+d.fl+d.cl);
      s+=box(bx[1],BW,yNa,y0,C.na);
      s+=segLabel2(bx[1],yNa,yRe,'資本金',capEq)+segLabel2(bx[1],yRe,y0,'利益剰余金',d.re);
      if(d.re>0&&d.na>0) s+=`<line x1="${bx[1]}" y1="${yRe}" x2="${bx[1]+BW}" y2="${yRe}" stroke="#fff" stroke-width="1.5" stroke-dasharray="6 4"/>`;
      s+=`<rect x="${bx[1]}" y="${yNa}" width="${BW}" height="${Math.max(0,yRe-yNa)}" fill="transparent"><title>${tt('資本金',capEq,d.totalCapital)}</title></rect>`;
      s+=`<rect x="${bx[1]}" y="${yRe}" width="${BW}" height="${Math.max(0,y0-yRe)}" fill="transparent"><title>${tt('利益剰余金',d.re,d.totalCapital)}</title></rect>`;
      s+=box(bx[1],BW,yFl,yNa,C.fl,tt('固定負債',d.fl,d.totalCapital))+segLabel(bx[1],yFl,yNa,d.fl);
      s+=box(bx[1],BW,yCl,yFl,C.cl,tt('流動負債',d.cl,d.totalCapital))+segLabel(bx[1],yCl,yFl,d.cl);
      s+=uchiBand(bx[1],yCl,yFl,d.cl,d.ibdShort,'うち有利子負債(短期)','#3a0d0b');
      s+=uchiBand(bx[1],yFl,yNa,d.fl,d.ibdLong,'うち有利子負債(長期)','#3a0d0b');
      naTop=yNa; naBot=y0; flTop=yFl; flBot=yNa;
    } else {
      const yFl=Y(d.fl), yNaNeg=Y(d.na); yCl=Y(d.fl+d.cl);
      s+=box(bx[1],BW,yFl,y0,C.fl,tt('固定負債',d.fl,d.totalCapital))+segLabel(bx[1],yFl,y0,d.fl);
      s+=box(bx[1],BW,yCl,yFl,C.cl,tt('流動負債',d.cl,d.totalCapital))+segLabel(bx[1],yCl,yFl,d.cl);
      s+=uchiBand(bx[1],yCl,yFl,d.cl,d.ibdShort,'うち有利子負債(短期)','#3a0d0b');
      s+=uchiBand(bx[1],yFl,y0,d.fl,d.ibdLong,'うち有利子負債(長期)','#3a0d0b');
      // 純資産マイナス（債務超過）＝baselineから下へ赤で表示
      s+=`<rect x="${bx[1]}" y="${y0}" width="${BW}" height="${Math.max(0,yNaNeg-y0)}" fill="#f5c6c3" stroke="#c53030" stroke-width="1"><title>${tt('純資産（債務超過）',d.na,d.totalCapital)}</title></rect>`;
      if(yNaNeg-y0>=26) s+=`<text x="${bx[1]+BW/2}" y="${(y0+yNaNeg)/2-3}" font-size="10" fill="#c53030" text-anchor="middle">債務超過</text><text x="${bx[1]+BW/2}" y="${(y0+yNaNeg)/2+11}" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">${fmt(d.na)}</text>`;
      else if(yNaNeg-y0>=12) s+=`<text x="${bx[1]+BW/2}" y="${(y0+yNaNeg)/2+4}" font-size="10" fill="#c53030" text-anchor="middle" font-weight="bold">${fmt(d.na)}</text>`;
      naTop=y0; naBot=yNaNeg; flTop=yFl; flBot=y0;
    }
    // 売上（PL）粗利・利益はマイナス（損失）にも対応
    const ySales=Y(d.sales), yGp=Y(d.grossProfit), yOp=Y(d.operatingProfit), yNi=Y(d.netIncome);
    if(showPL){
      s+=box(bx[2],BW,ySales,y0,'#ffffff',tt('売上高',d.sales,0));
      const gpT=Y(Math.max(d.grossProfit,0)), gpB=Y(Math.min(d.grossProfit,0));
      s+=box(bx[2],BW,gpT,gpB,C.gp,tt('粗利',d.grossProfit,d.sales))+segLabel(bx[2],gpT,gpB,d.grossProfit);
      if(d.grossProfit>0) s+=uchiBand(bx[2],ySales,yGp,(d.sales-d.grossProfit),d.depcogs,'うち減価償却費(製造原価)','#1c4e80');
      if(d.operatingProfit>0 && d.grossProfit>d.operatingProfit) s+=uchiBand(bx[2],yGp,yOp,(d.grossProfit-d.operatingProfit),d.depsga,'うち減価償却費(販管費)','#1c4e80');
      s+=`<line x1="${bx[2]}" y1="${yOp}" x2="${bx[2]+BW}" y2="${yOp}" stroke="#333" stroke-width="1.5"><title>${tt('営業利益',d.operatingProfit,d.sales)}</title></line>`;
      s+=`<line x1="${bx[2]}" y1="${yNi}" x2="${bx[2]+BW}" y2="${yNi}" stroke="#c53030" stroke-width="1.5"><title>${tt('当期純利益',d.netIncome,d.sales)}</title></line>`;
      if(d.netIncome<0) s+=`<text x="${bx[2]+BW/2}" y="${yNi+13}" font-size="10" fill="#c53030" text-anchor="middle" font-weight="bold">当期純損失 ${fmt(d.netIncome)}</text>`;
    }
    s+=`<text x="${bx[0]+BW/2}" y="${yA-7}" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">${fmt(d.totalAssets)}</text>`;
    s+=`<text x="${bx[1]+BW/2}" y="${yCl-7}" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">${fmt(d.totalCapital)}</text>`;
    if(showPL) s+=`<text x="${bx[2]+BW/2}" y="${ySales-7}" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">${fmt(d.sales)}</text>`;
    s+=`<text x="${gx+groupInner/2}" y="${BOT+26}" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">${TLAB(year)}</text>`;
    s+=`<text x="${bx[0]+BW/2}" y="${BOT+44}" font-size="11" fill="#666" text-anchor="middle">資産</text>`;
    s+=`<text x="${bx[1]+BW/2}" y="${BOT+44}" font-size="11" fill="#666" text-anchor="middle">負債・純資産</text>`;
    if(showPL) s+=`<text x="${bx[2]+BW/2}" y="${BOT+44}" font-size="11" fill="#666" text-anchor="middle">売上</text>`;
    if(hi){
      const B={ca:[bx[0],yA,yFa],fa:[bx[0],yFa,y0],cl:[bx[1],yCl,flTop],fl:[bx[1],flTop,flBot],na:[bx[1],naTop,naBot]};
      if(showPL){ B.sales=[bx[2],ySales,y0]; B.gp=[bx[2],Y(Math.max(d.grossProfit,0)),Y(Math.min(d.grossProfit,0))]; }
      for(const k in B){ if(!boxKeep.has(k)){ const b=B[k], t=Math.min(b[1],b[2]), bo=Math.max(b[1],b[2]); s+=`<rect x="${b[0]}" y="${t}" width="${BW}" height="${Math.max(0,bo-t)}" fill="#f4f5f7" fill-opacity="0.66"/>`; } }
      const groups={};
      (hi.boxes||[]).forEach(k=>{ const b=B[k]; if(!b) return; const col=b[0], t=Math.min(b[1],b[2]), bo=Math.max(b[1],b[2]); if(!groups[col]) groups[col]=[b[0],t,bo]; else{ const g=groups[col]; g[1]=Math.min(g[1],t); g[2]=Math.max(g[2],bo); } });
      Object.keys(groups).forEach(col=>{ const g=groups[col]; s+=`<rect x="${g[0]}" y="${g[1]}" width="${BW}" height="${Math.max(0,g[2]-g[1])}" fill="none" stroke="${GOLD}" stroke-width="4"/>`; });
      if(showPL) (hi.lines||[]).forEach(k=>{ const y=(k==='op')?yOp:yNi; s+=`<line x1="${bx[2]}" y1="${y}" x2="${bx[2]+BW}" y2="${y}" stroke="${GOLD}" stroke-width="4"/>`; });
    }
  });
  s+=`</svg>`; return s;
}
function drawChart(ds){ $("chart").innerHTML = comboSVG(ds, currentHi(), true); }
// 1期分の詳細図（内訳で設定した科目名・数値まで表示・横幅ワイド）
const SHADES={

  fa:['#74ad69','#5e9a52','#4E8A46','#437a3d','#396a34','#2f5a2b'],

function comboDetailSVG(row, hi, showPL){
  showPL = showPL!==false;
  const d=row.d, u=unitStr();
  const BW=150,PLGAP=64,AX=95,TOP=82,BOT=560,chH=BOT-TOP,x0=135;
  const bx=[x0,x0+BW,x0+2*BW+PLGAP];
  const W = showPL ? 784 : (2*x0+2*BW), H=624;
  const catX={ca:bx[0],fa:bx[0],cl:bx[1],fl:bx[1],na:bx[1],sales:bx[2],gp:bx[2]};
  let posMax=Math.max(d.totalAssets,d.totalCapital,d.cl+d.fl+Math.max(d.na,0),d.cl+d.fl, showPL?d.sales:0, showPL?d.grossProfit:0);
  let negMin=Math.min(0,d.na, showPL?d.grossProfit:0, showPL?d.operatingProfit:0, showPL?d.ordinaryProfit:0, showPL?d.netIncome:0);
  if(posMax<=0)posMax=1;
  const span=posMax-negMin, Y=v=>BOT-((v-negMin)/span)*chH, y0=Y(0);
  const boxKeep=hi?new Set(hi.boxes||[]):null; if(boxKeep&&boxKeep.has('sales'))boxKeep.add('gp');
  const catR={};
  const note=(cat,t,bo)=>{ if(!catR[cat])catR[cat]=[Math.min(t,bo),Math.max(t,bo)]; else{catR[cat][0]=Math.min(catR[cat][0],t,bo);catR[cat][1]=Math.max(catR[cat][1],t,bo);} };
  let s=`<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto;max-width:${W}px;margin:0 auto;font-family:inherit;">`;
  s+=`<line x1="${AX}" y1="${TOP}" x2="${AX}" y2="${BOT}" stroke="#333" stroke-width="1.5"/>`;
  s+=`<text x="${AX-28}" y="${TOP-16}" font-size="14" fill="#333">％</text>`;
  const pMin=Math.floor((negMin/posMax*100)/20)*20;
  for(let p=pMin;p<=100;p+=20){ const y=Y(p/100*posMax),emph=p===0;
    s+=`<line x1="${AX}" y1="${y}" x2="${W-16}" y2="${y}" stroke="${emph?'#b8bcc2':'#eef1f4'}" stroke-width="${emph?1.2:1}"/><line x1="${AX-6}" y1="${y}" x2="${AX}" y2="${y}" stroke="#333"/><text x="${AX-10}" y="${y+5}" font-size="13" fill="#555" text-anchor="end">${p}</text>`; }
  s+=`<text x="6" y="${TOP-16}" font-size="13" fill="#777">単位：${u}</text>`;
  s+=`<text x="${AX+10}" y="${TOP-16}" font-size="13" fill="#555">${TLAB(row.year)}（最大値 ${fmt(posMax)} を100%）</text>`;
  const seglabel=(x,t,bo,nm,val)=>{ const hh=bo-t; if(hh>=24) return `<text x="${x+BW/2}" y="${(t+bo)/2-2}" font-size="10.5" fill="#fff" text-anchor="middle">${nm}</text><text x="${x+BW/2}" y="${(t+bo)/2+13}" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="bold">${fmt(val)}</text>`; if(hh>=13) return `<text x="${x+BW/2}" y="${(t+bo)/2+4}" font-size="10" fill="#fff" text-anchor="middle">${fmt(val)}</text>`; return ''; };
  const drawStack=(x, segs, base)=>{ let cum=base, out=''; segs.forEach(sg=>{ if(!sg.val) return; const yb=Y(cum), yt=Y(cum+sg.val), t=Math.min(yt,yb), bo=Math.max(yt,yb);
      out+=`<rect x="${x}" y="${t}" width="${BW}" height="${Math.max(0,bo-t)}" fill="${sg.col}" stroke="#fff" stroke-width="0.8"><title>${sg.name}：${fmt(sg.val)} ${u}</title></rect>`+seglabel(x,t,bo,sg.name,sg.val);
      if(sg.cat) note(sg.cat,t,bo); cum+=sg.val; }); return out; };

  // 資産（固定→流動）

  const caSegs=d.detCa?mapseg([['現預金',d.cash],['売上債権',d.recv],['棚卸資産',d.inv],['短期貸付金',d.stloanto],['前払・仮払',d.prepaid],['その他流動資産',d.oca]],SHADES.ca,'ca'):[{name:'流動資産',val:d.ca,col:C.ca,cat:'ca'}];
  s+=drawStack(bx[0], faSegs.concat(caSegs), 0);

  const flSegs=d.detFl?mapseg([['長期借入金',d.ltloan],['社債',d.bond],['役員・関係者借入',d.execloan],['リース・引当金',d.lease],['その他長期負債',d.ofl]],SHADES.fl,'fl'):[{name:'固定負債',val:d.fl,col:C.fl,cat:'fl'}];
  const clSegs=d.detCl?mapseg([['買掛金・支払手形',d.payb],['短期借入金',d.stloan],['1年内返済長期借入',d.cpltd],['未払金・未払費用',d.payables],['未払税金',d.taxpay],['その他短期負債',d.ocl]],SHADES.cl,'cl'):[{name:'流動負債',val:d.cl,col:C.cl,cat:'cl'}];
  if(d.na>=0){

    if(yNaNeg-y0>=24) s+=`<text x="${bx[1]+BW/2}" y="${(y0+yNaNeg)/2-2}" font-size="10.5" fill="#c53030" text-anchor="middle">純資産(債務超過)</text><text x="${bx[1]+BW/2}" y="${(y0+yNaNeg)/2+12}" font-size="11.5" fill="#c53030" text-anchor="middle" font-weight="bold">${fmt(d.na)}</text>`;
    note('na',y0,yNaNeg);
  }

  if(showPL){
    s+=`<rect x="${bx[2]}" y="${ySales}" width="${BW}" height="${Math.max(0,y0-ySales)}" fill="#ffffff" stroke="#333" stroke-width="1"><title>売上高：${fmt(d.sales)} ${u}</title></rect>`;

      const gpSeg={name:'粗利',val:d.grossProfit,col:C.gp,cat:'gp'};
      const cogsSegs=d.detCogs?mapseg(cogsLeaves().map(l=>[l[1],d[l[0]]]),SHADES.cogs,'sales'):[{name:'売上原価',val:d.cogs,col:'#b9b9b9',cat:'sales'}];
      s+=drawStack(bx[2],[gpSeg].concat(cogsSegs),0);
    } else {
      const gpT=Y(Math.max(d.grossProfit,0)),gpB=Y(Math.min(d.grossProfit,0));
      s+=`<rect x="${bx[2]}" y="${gpT}" width="${BW}" height="${Math.max(0,gpB-gpT)}" fill="${C.gp}" stroke="#333"><title>粗利：${fmt(d.grossProfit)} ${u}</title></rect>`+seglabel(bx[2],gpT,gpB,'粗利',d.grossProfit); note('gp',gpT,gpB);
    }
    const pline=(y,col,nm,val)=> `<line x1="${bx[2]}" y1="${y}" x2="${bx[2]+BW}" y2="${y}" stroke="${col}" stroke-width="1.6"><title>${nm}：${fmt(val)} ${u}</title></line><text x="${bx[2]+BW+4}" y="${y+4}" font-size="10" fill="${col}">${nm} ${fmt(val)}</text>`;
    s+=pline(yOp,'#333','営業利益',d.operatingProfit)+pline(yOrd,'#2b6cb0','経常利益',d.ordinaryProfit)+pline(yNi,'#c53030',(d.netIncome<0?'当期純損失':'当期純利益'),d.netIncome);
    s+=`<text x="${bx[2]+BW/2}" y="${ySales-6}" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">${fmt(d.sales)}</text>`;

  if(hi){

    const grp={};
    (hi.boxes||[]).forEach(cat=>{ if(!catR[cat])return; const col=catX[cat]; if(!grp[col])grp[col]=[catR[cat][0],catR[cat][1]]; else{grp[col][0]=Math.min(grp[col][0],catR[cat][0]);grp[col][1]=Math.max(grp[col][1],catR[cat][1]);} });
    Object.keys(grp).forEach(col=>{ const g=grp[col]; s+=`<rect x="${col}" y="${g[0]}" width="${BW}" height="${Math.max(0,g[1]-g[0])}" fill="none" stroke="${GOLD}" stroke-width="4"/>`; });

  }
  s+=`</svg>`; return s;
}
function drawIBDDiverge(ds){
  const items=ds.map(({year,d})=>({year, st:d.ibdShort, lt:d.ibdLong, cap:d.totalCapital, ibd:d.ibd}));
  let mx=1; items.forEach(x=>{ mx=Math.max(mx,x.st,x.lt); });
  const anyIbd=items.some(x=>x.ibd>0), n=items.length, u=unitStr();
  const W=Math.max(480,120+n*120), H=360, AX=70, TOP=34, BOT=326, MID=(TOP+BOT)/2, half=(BOT-MID)-16;
  let s=svgOpen(W,H)+`<text x="6" y="16" font-size="12" fill="#777">有利子負債の内訳（上＝短期(＋)／下＝長期(−)・単位：${u}／( )内は総資本比）</text>`;
  if(!anyIbd){ s+=`<text x="${W/2}" y="${MID}" font-size="13" fill="#999" text-anchor="middle">負債の内訳（★短期借入金・長期借入金・社債等）を入力すると表示されます</text></svg>`; return s; }
  s+=`<line x1="${AX}" y1="${MID}" x2="${W-16}" y2="${MID}" stroke="#333" stroke-width="1.2"/><text x="${AX-8}" y="${MID+4}" font-size="12" fill="#555" text-anchor="end">0</text>`;
  const gW=(W-AX-24)/n, bw=Math.min(70,gW-30);
  items.forEach((x,gi)=>{ const cx=AX+16+gi*gW+gW/2, hS=x.st/mx*half, hL=x.lt/mx*half, pS=x.cap?x.st/x.cap*100:0, pL=x.cap?x.lt/x.cap*100:0;
    s+=`<rect x="${cx-bw/2}" y="${MID-hS}" width="${bw}" height="${Math.max(0,hS)}" fill="#C4433F"><title>短期有利子負債 ${TLAB(x.year)}：${fmt(x.st)} ${u}（${p1(pS)}%）</title></rect>`;
    if(x.st>0) s+=`<text x="${cx}" y="${MID-hS-5}" font-size="11" text-anchor="middle" font-weight="bold" fill="#333">${fmt(x.st)} (${p1(pS)}%)</text>`;
    s+=`<rect x="${cx-bw/2}" y="${MID}" width="${bw}" height="${Math.max(0,hL)}" fill="#CC6A1F"><title>長期有利子負債 ${TLAB(x.year)}：${fmt(x.lt)} ${u}（${p1(pL)}%）</title></rect>`;
    if(x.lt>0) s+=`<text x="${cx}" y="${MID+hL+14}" font-size="11" text-anchor="middle" font-weight="bold" fill="#333">${fmt(x.lt)} (${p1(pL)}%)</text>`;
    s+=`<text x="${cx}" y="${BOT+18}" font-size="12" text-anchor="middle" font-weight="bold">${TLAB(x.year)}</text>`;
  });
  s+=`</svg>`; return s;
}
function plWaterfall(d, title){

const ALL_METRICS={}; Object.values(CATS).forEach(c=>c.metrics.forEach(m=>{ALL_METRICS[m.key]=m;}));
const findMetric=(cat,key)=> CATS[cat].metrics.find(m=>m.key===key);
const metricReady=(m,d)=> m.ready? m.ready(d): true;
function metricDisp(m,d){
  if(!metricReady(m,d)) return '—';
  if(m.dispVal) return m.dispVal(d);
  const v=m.v(d); const s=(m.dec===0)?fmt(v):(m.dec===2?p2(v):p1(v));
  const u=(typeof m.unit==='function')?m.unit():m.unit;
  return `${s}<small>${u}</small>`;
}
const metricJudge=(m,d)=> metricReady(m,d)? m.judge(d): null;
function currentHi(){ const m=findMetric(curCat,curKey); return m ? m.hi : null; }

function judgeTable(rows, curLv){
  let h=`<table class="judge"><tr><th>判定</th><th>目安（範囲）</th><th>コメント</th></tr>`;
  rows.forEach(r=>{ const cur=(r.lv===curLv);
    h+=`<tr class="${cur?'cur':''}"><td class="lv ${r.lv}">${r.name}</td><td>${r.range}</td><td>${r.note}${cur?'<span class="cur-tag">◀ 現在</span>':''}</td></tr>`; });
  return h+`</table>`;
}
function cmpTable(m, ds){
  const avail=ds.length, nsel=Math.min(cmpN,avail), start=avail-nsel;
  const isAmt=(typeof m.unit==='function');
  let h=`<div class="cmp-toggle">`+[1,2,3].map(nn=>`<button class="cbtn ${cmpN===nn?'active':''}" data-n="${nn}" ${nn>avail?'disabled':''}>${nn}期</button>`).join('')+`</div>`;
  h+=`<table class="judge"><tr><th>期</th><th>${m.label}</th><th>前期比</th><th>判定</th></tr>`;
  for(let i=start;i<avail;i++){
    const r=ds[i], disp=metricDisp(m,r.d);
    let delta='—';
    if(i>0 && metricReady(m,r.d) && metricReady(m,ds[i-1].d)){
      const v=m.v(r.d), pv=m.v(ds[i-1].d);
      if(isFinite(v)&&isFinite(pv)){
        if(isAmt){ const g=pv? (v-pv)/Math.abs(pv)*100:0; delta=`${g>=0?'+':''}${p1(g)}%`; }
        else if(m.unit==='%'){ const dd=v-pv; delta=`${dd>=0?'+':''}${p1(dd)}pt`; }
        else { const dd=v-pv; delta=`${dd>=0?'+':''}${p2(dd)}${m.unit}`; }
      }
    }
    const lv=metricJudge(m,r.d);
    const bd = lv? badge(lv,(m.rows.find(x=>x.lv===lv)||{}).name||''):badge('na','—');
    h+=`<tr><td>${TLAB(r.year)}</td><td class="num">${disp}</td><td class="num">${delta}</td><td>${bd}</td></tr>`;
  }
  return h+`</table>`;
}
function metricDetailHTML(m, ds, catNote){
  const latest=ds[ds.length-1].d, latestYear=ds[ds.length-1].year;
  const lv=metricJudge(m,latest);
  const b = lv? badge(lv,(m.rows.find(r=>r.lv===lv)||{}).name||''):badge('na','参考');
  const noteHTML=(m.note||catNote)?`<div class="md-note">${m.note||''}${catNote||''}</div>`:'';
  return `<div class="md-head"><span class="md-title">${m.label}<span style="font-size:11px;color:#94a3b8;font-weight:600;margin-left:8px;">最新：${TLAB(latestYear)}</span></span><span class="md-value">${metricDisp(m,latest)} ${b}</span></div>
     <div class="md-body">
       <div><div class="md-label">計算式（${TLAB(latestYear)}）</div><div class="md-formula">${m.formula(latest)}</div></div>
       <div><div class="md-label">指標の意味</div><div class="md-meaning">${m.meaning}</div></div>
       <div class="md-table"><div class="md-label">期間比較（1期／3期／5期）</div>${cmpTable(m,ds)}</div>
       <div class="md-table"><div class="md-label">判定の目安</div>${judgeTable(m.rows, lv)}</div>
       ${noteHTML}
     </div>`;
}
function renderAnalysis(ds){
  document.querySelectorAll('#subtabs .subtab').forEach(b=> b.classList.toggle('active', b.dataset.cat===curCat));
  const cat=CATS[curCat];
  const hasDetail=cat.metrics.some(m=>m.detailOnly);
  const mets=cat.metrics.filter(m=> showDetail || !m.detailOnly);
  if(!mets.some(m=>m.key===curKey)) curKey=mets[0].key;
  const latest=ds[ds.length-1].d;
  let btns = mets.map(m=> `<button class="mbtn ${m.key===curKey?'active':''}" data-key="${m.key}"><span>${m.label}</span><span class="mbv">${metricDisp(m,latest)}</span></button>`).join('');
  if(hasDetail) btns += `<button class="mbtn detmet ${showDetail?'active':''}" id="detMetToggle"><span>${showDetail?'− 詳細指標を隠す':'＋ 詳細指標'}</span></button>`;
  $("metricbtns").innerHTML = btns;
  $("metricdetail").innerHTML = metricDetailHTML(findMetric(curCat,curKey), ds, cat.note);
}

  const finCF=(c.ibd-a.ibd)+(c.cap-a.cap)+(c.csurp-a.csurp)-dividend;

}

/* ---- sub-tab renderers ---- */
let scope='all', pmode='multi', pidx=-1, plBreak='main';
const BS_LEGEND=`<span class="lg"><i style="background:${C.ca}"></i>流動資産</span><span class="lg"><i style="background:${C.fa}"></i>固定資産</span><span class="lg"><i style="background:${C.cl}"></i>流動負債</span><span class="lg"><i style="background:${C.fl}"></i>固定負債</span><span class="lg"><i style="background:${C.na}"></i>純資産</span><span class="lg" style="color:#888">点線の内枠＝うち有利子負債／うち減価償却費</span>`;
const LEG_FULL = BS_LEGEND+`<span class="lg"><i style="background:${C.gp}"></i>粗利</span>`;
function renderMainChart(ds){
  document.querySelectorAll('#scopeToggle .cbtn').forEach(x=>x.classList.toggle('active',x.dataset.scope===scope));
  $("mainExtra").innerHTML='';
  const hi=currentHi();
  if(scope==='cs'){ renderCS(ds); return; }
  const idx = pidx<0? ds.length-1 : Math.min(pidx, ds.length-1);
  const modeChips=`<span class="ctl-lbl">期間：</span><button class="chip ${pmode==='multi'?'on':''}" data-pmode="multi">3期比較</button><button class="chip ${pmode==='single'?'on':''}" data-pmode="single">1期比較</button>`;
  let ctl=`<div class="ctl-row">${modeChips}`;
  if(pmode==='single') ctl+=`<span class="ctl-lbl" style="margin-left:8px;">対象期：</span><select id="mPeriod">`+ds.map((r,i)=>`<option value="${i}" ${i===idx?'selected':''}>${TLAB(r.year)}</option>`).join('')+`</select>`;
  if(scope==='pl'&&pmode==='multi') ctl+=`<span class="ctl-lbl" style="margin-left:8px;">内訳：</span><button class="chip ${plBreak==='main'?'on':''}" data-plbreak="main">主要項目</button><button class="chip ${plBreak==='cogs'?'on':''}" data-plbreak="cogs">原価の内訳</button><button class="chip ${plBreak==='sga'?'on':''}" data-plbreak="sga">販管費の内訳</button>`;
  ctl+=`</div>`;
  $("mainControls").innerHTML=ctl;
  if(scope==='all'){
    if(pmode==='multi'){ $("chart").innerHTML=`<div class="fig60">`+comboSVG(ds,hi,true)+`</div>`; $("legend").innerHTML=LEG_FULL; }
    else { $("chart").innerHTML=comboDetailSVG(ds[idx],hi,true); $("legend").innerHTML=LEG_FULL; }
  } else if(scope==='bs'){
    if(pmode==='multi'){ $("chart").innerHTML=`<div class="fig60">`+comboSVG(ds,hi,false)+`</div>`; $("legend").innerHTML=BS_LEGEND; }
    else { $("chart").innerHTML=comboDetailSVG(ds[idx],hi,false); $("legend").innerHTML=BS_LEGEND; }
  } else if(scope==='pl'){
    if(pmode==='single'){ const wf=plWaterfall(ds[idx].d, `${TLAB(ds[idx].year)} PLウォーターフォール`); $("chart").innerHTML=wf.svg; $("legend").innerHTML=wf.legend; }
    else if(plBreak==='main'){ const cmp=drawSeries(ds,['sales','cogs','grossProfit','sga','operatingProfit','ordinaryProfit','netIncome'],'bar'); $("chart").innerHTML=cmp.svg; $("legend").innerHTML=cmp.legend; }
    else { const r=drawItemTrend(ds, plBreak==='cogs'?cogsLeaves():SGA_LEAVES, plBreak==='cogs'?'売上原価の内訳':'販管費の内訳'); $("chart").innerHTML=r.svg; $("legend").innerHTML=r.legend; }
  }
}
function renderCS(ds){
  const modeChips=`<span class="ctl-lbl">期間：</span><button class="chip ${pmode==='multi'?'on':''}" data-pmode="multi">3期比較</button><button class="chip ${pmode==='single'?'on':''}" data-pmode="single">2期比較（1期分）</button>`;
  if(ds.length<2){ $("mainControls").innerHTML=`<div class="ctl-row">${modeChips}</div>`; $("chart").innerHTML='<p class="ph">簡易CFには2期以上の入力が必要です。「② 数値入力」で期を追加してください。</p>'; $("legend").innerHTML=''; return; }
  const idx=pidx<1?ds.length-1:Math.min(pidx,ds.length-1);
  let ctl=`<div class="ctl-row">${modeChips}`;
  if(pmode==='single') ctl+=`<span class="ctl-lbl" style="margin-left:8px;">対象期：</span><select id="mPeriod">`+ds.map((r,i)=> i>=1?`<option value="${i}" ${i===idx?'selected':''}>${TLAB(ds[i-1].year)}→${TLAB(r.year)}</option>`:'').join('')+`</select>`;
  ctl+=`</div>`;
  $("mainControls").innerHTML=ctl;
  if(pmode==='single'){ const cf=computeCF(ds[idx-1].d,ds[idx].d);
    const r=drawSteps([{t:'flow',label:'営業CF',amt:cf.opCF},{t:'flow',label:'投資CF',amt:cf.invCF},{t:'flow',label:'財務CF',amt:cf.finCF},{t:'flow',label:'その他調整',amt:cf.adj},{t:'total',label:'現金増減',val:cf.actual}], `${TLAB(ds[idx-1].year)}→${TLAB(ds[idx].year)} 簡易キャッシュフロー`);
    $("chart").innerHTML=r.svg; $("legend").innerHTML=r.legend;
  } else { const r=drawCFCompare(ds); $("chart").innerHTML=r.svg; $("legend").innerHTML=r.legend; }
  const a=ds[idx-1].d,c=ds[idx].d,cf=computeCF(a,c),pat=cfPattern(cf.opCF,cf.invCF,cf.finCF),u=unitStr();
  const opm=c.sales?cf.opCF/c.sales*100:0, sgn=v=>(v>=0?'+':'')+fmt(v), tile=(t,v)=>`<div class="cf-tile"><div class="t">${t}</div><div class="v">${v}</div></div>`;
  let mh=`<div class="cf-pattern"><div><span class="cf-badge">該当 ${pat?pat.no+' '+pat.name:'—'}</span></div><div class="cf-desc">${pat?pat.desc:''}</div><div class="cf-signs">営業CF <b>${sgn(cf.opCF)}</b>　／　投資CF <b>${sgn(cf.invCF)}</b>　／　財務CF <b>${sgn(cf.finCF)}</b>　（${TLAB(ds[idx-1].year)}→${TLAB(ds[idx].year)}・単位：${u}）</div></div>`;
  mh+=`<div class="cf-tiles">${tile('営業CF',fmt(cf.opCF))}${tile('投資CF',fmt(cf.invCF))}${tile('財務CF',fmt(cf.finCF))}${tile('フリーCF',fmt(cf.fcf))}${tile('現金増減',fmt(cf.actual))}${tile('営業CFマージン',p1(opm)+'%')}</div>`;
  mh+=`<div class="cf-h">キャッシュフロー8パターン（該当を強調）</div><div class="cf-grid">`+CF_PATTERNS.map(p=>`<div class="cf-card ${pat&&p.sign===pat.sign?'cur':''}"><div class="cf-mini">${cfMini(p.sign)}</div><div class="cf-ct"><div class="nm">${p.no} ${p.name}</div><div class="ds">${p.desc}</div></div></div>`).join('')+`</div>`;
  const rows=[['opCF','営業CF'],['invCF','投資CF'],['finCF','財務CF'],['fcf','フリーCF(営業+投資)'],['adj','その他調整'],['actual','現金増減']];
  let t=`<div class="cf-h">簡易CF 数値表（単位：${u}）</div><div class="detail-wrap"><table class="cmp-detail"><thead><tr><th class="itemcol">項目</th>`;
  for(let i=1;i<ds.length;i++) t+=`<th>${TLAB(ds[i-1].year)}→${TLAB(ds[i].year)}</th>`;
  t+=`</tr></thead><tbody>`;
  rows.forEach(([k,nm])=>{ t+=`<tr class="${k==='actual'?'grand':(k==='fcf'?'totrow':'')}"><td class="itemcol">${nm}</td>`;
    for(let i=1;i<ds.length;i++){ const cf2=computeCF(ds[i-1].d,ds[i].d); t+=`<td class="num">${fmt(cf2[k])}</td>`; } t+=`</tr>`; });
  t+=`</tbody></table></div>`;
  $("mainExtra").innerHTML=mh+t;
}


/* ---------- run ---------- */
function run(){
  applyUnitLabels();
  sortPeriods();
  renderPeriodBar();
  updateComputedInputs();
  const ds=derived();
  renderAnalysis(ds);   // 先に指標を確定（選択指標＝チャート強調に反映）
  renderMainChart(ds);
}

/* ---------- listeners ---------- */
function onFormInput(e){
  const t=e.target; if(t.tagName!=='INPUT'||!t.id.startsWith('in_')||t.readOnly) return;
  const key=t.id.slice(3);
  periods[curIdx].vals[key]=parseFloat(t.value)||0;
  run();
}
$("bsLeft").addEventListener("input", onFormInput);
$("bsRight").addEventListener("input", onFormInput);
$("plForm").addEventListener("input", onFormInput);
$("unit").addEventListener("change", run);
$("costType").addEventListener("change", e=>{ costType=e.target.value; buildInputForm(); run(); });
$("resetBtn").addEventListener("click", openResetModal);
$("delBtn").addEventListener("click", openDeleteModal);
$("periodbar").addEventListener("click", e=>{
  const t=e.target;
  if(t.classList.contains("ptab")){ curIdx=+t.dataset.i; buildInputForm(); run(); return; }
  if(t.id==="addBtn"){ openAddModal(); return; }
});
$("modalCancel").addEventListener("click", closeModal);
$("modal").addEventListener("click", e=>{ if(e.target.id==='modal') closeModal(); });
$("modalOk").addEventListener("click", ()=>{ if(!modalOnOk || modalOnOk()!==false) closeModal(); });
$("modal").addEventListener("keydown", e=>{ if(e.key==='Enter'){ e.preventDefault(); $("modalOk").click(); } else if(e.key==='Escape'){ closeModal(); } });

function switchTab(name){
  document.querySelectorAll(".tab").forEach(t=> t.classList.toggle("active", t.dataset.tab===name));
  document.querySelectorAll(".tabpane").forEach(p=> p.classList.toggle("active", p.id==="tab-"+name));
}
document.querySelectorAll(".tab").forEach(t=> t.addEventListener("click", ()=> switchTab(t.dataset.tab)));
$("calcBtn").addEventListener("click", ()=>{ run(); switchTab("view"); });
$("subtabs").addEventListener("click", e=>{ const b=e.target.closest(".subtab"); if(!b) return; curCat=b.dataset.cat; curKey=CATS[curCat].metrics.filter(m=>!m.detailOnly)[0].key; run(); });
$("metricbtns").addEventListener("click", e=>{ const b=e.target.closest(".mbtn"); if(!b) return; if(b.id==='detMetToggle'){ showDetail=!showDetail; } else if(b.dataset.key){ curKey=b.dataset.key; } run(); });
$("metricdetail").addEventListener("click", e=>{ const b=e.target.closest(".cbtn"); if(!b||b.disabled) return; cmpN=+b.dataset.n; run(); });
$("scopeToggle").addEventListener("click", e=>{ const b=e.target.closest(".cbtn"); if(!b) return; scope=b.dataset.scope; pidx=-1; run(); });
$("mainControls").addEventListener("click", e=>{
  const b=e.target.closest("[data-pmode],[data-plbreak]"); if(!b) return;
  if(b.dataset.pmode){ pmode=b.dataset.pmode; run(); }
  else if(b.dataset.plbreak){ plBreak=b.dataset.plbreak; run(); }
});
$("mainControls").addEventListener("change", e=>{ if(e.target.id==='mPeriod'){ pidx=+e.target.value; run(); } });

buildInputForm();
run();
</script>
</body>
</html>
